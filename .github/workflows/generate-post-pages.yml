name: Generate SEO article pages

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-seo-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate static article pages
        run: node scripts/generate-post-pages.mjs

      - name: Commit generated pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated page changes."
          else
            git commit -m "Generate SEO pages for published posts"
            git push
          fi
